[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "revs-casino-harness"
version = "0.1.0"
description = "Casino harness with a legacy CDP player and an opt-in visible-UI planner"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.20,<2",
    "playwright>=1.48,<2",
]

[project.scripts]
casino = "casino.cli:main"
revs-ui = "uiadapt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["casino", "uiadapt"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
# Historical snapshots under docs/ are not the active test suite.
testpaths = ["tests"]
